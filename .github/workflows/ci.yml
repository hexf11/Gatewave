name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android 检查
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      - name: 校验 Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.2.0

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: 安装 Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: 执行 Lint、测试和 Debug 构建
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gatewave-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatewave-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
