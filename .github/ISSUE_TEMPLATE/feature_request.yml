name: 功能建议
description: 建议新的能力或体验改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请说明现在遇到的问题，而不只是描述实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 网络、安全和兼容性影响
